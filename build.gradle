plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gbujak'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
	implementation 'org.komamitsu:spring-data-sqlite:1.3.0'
	runtimeOnly 'org.xerial:sqlite-jdbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

def frontendDir = layout.projectDirectory.dir('frontend')
def frontendDistDir = frontendDir.dir('dist')
def pnpm = providers.gradleProperty('pnpmCommand').orElse('pnpm')

tasks.register('pnpmInstall', Exec) {
	group = 'frontend'
	description = 'Installs frontend dependencies with pnpm.'
	workingDir frontendDir.asFile
	commandLine pnpm.get(), 'install', '--frozen-lockfile'
	inputs.files(frontendDir.file('package.json'), frontendDir.file('pnpm-lock.yaml'))
	outputs.dir(frontendDir.dir('node_modules'))
}

tasks.register('buildFrontend', Exec) {
	group = 'frontend'
	description = 'Builds the frontend with Vite.'
	dependsOn 'pnpmInstall'
	workingDir frontendDir.asFile
	commandLine pnpm.get(), 'run', 'build'
	inputs.dir(frontendDir.dir('src'))
	inputs.files(
		frontendDir.file('package.json'),
		frontendDir.file('pnpm-lock.yaml'),
		frontendDir.file('vite.config.ts'),
		frontendDir.file('index.html'),
		frontendDir.file('tsconfig.json'),
		frontendDir.file('tsconfig.app.json'),
		frontendDir.file('tsconfig.node.json')
	)
	outputs.dir(frontendDistDir)
}

tasks.named('processResources') {
	dependsOn 'buildFrontend'
	from(frontendDistDir) {
		into 'static'
	}
}
